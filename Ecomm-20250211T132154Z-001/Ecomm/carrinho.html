<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TV8GJJR');</script>
    <!-- End Google Tag Manager -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f8f8f8;
        }
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 5px;
            background-color:#F0DFC2;
            color: white;
            margin-top: 2px;
            margin-bottom: 20px;
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            padding-right: 5px;
        }
        .logo-container {
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #93A490;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100px;
            height: auto;
            width: auto;
        }
        .cart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
            margin: auto;

        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .cart-item img {
            width: 90px;
            height: 110px;
            border-radius: 5px;
        }
        .item-details {
            flex-grow: 1;
            margin-left: 10px;
            text-align: left;
        }
        .quantity-controls button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 3px;
        }
        .quantity-controls button:hover {
            background-color: #45a049;
        }
        .checkout {
            background-color:#93A490;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .checkout:hover {
            background-color: #4E6353;
        }
    </style>
</head>
<body>
    <div class="logo-container"><a href="index.html">
        <img src="img/logo.png" alt="Logo Moonflower" class="logo"></a>
    </div>
    <header>
        <nav class="navbar">
            <div class="cart-icon"><img src="https://static.giulianaflores.com.br/images/site/icon_cart.png" alt="Sacola de compras" class="cart-icon"></div>
        </nav>   
    </header>
    <div class="cart-container">
        <h2>Seu Carrinho</h2>
        <div class="cart-item">
            <img src="https://flordacidade.com/site/wp-content/uploads/2018/04/IMG_20220923_151515956_HDR-fotor-2023062894433.jpg" alt="Produto 1">
            <div class="item-details">
                <p>Buquê Jardim Secreto</p>
                <p>R$ 250,00</p>
                <div class="quantity-controls">
                    <button class="remove">-</button>
                    <span class="quantity">1</span>
                    <button class="add">+</button>
                </div>
            </div>
        </div><a href="pagamento.html">
        <button class="checkout">Continuar para Pagamento</button></a>
    </div>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TV8GJJR"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
</body>
</html>
