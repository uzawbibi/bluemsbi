<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TV8GJJR');</script>
    <!-- End Google Tag Manager -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f8f8f8;
        }
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 5px;
            background-color:#F0DFC2;
            color: white;
            margin-top: 2px;
            margin-bottom: 20px;
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            padding-right: 5px;
        }
        .logo-container {
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #93A490;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100px;
            height: auto;
            width: auto;
        }
        .payment-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
            margin: auto;
        }
        .payment-option {
            margin: 10px 0;
        }
        .pay-button {
            background-color: #008CBA;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .pay-button:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="img/logo.png" alt="Logo Moonflower" class="logo">
    </div>
    <header>
        <nav class="navbar">
            <div class="cart-icon"><img src="https://static.giulianaflores.com.br/images/site/icon_cart.png" alt="Sacola de compras" class="cart-icon"></div>
        </nav>   
    </header>
    <div class="payment-container">
        <h2>Escolha a forma de pagamento</h2>
        <div class="payment-option">
            <input type="radio" id="credit-card" name="payment-method" value="cartao" checked>
            <label for="credit-card">Cartão de Crédito</label>
        </div>
        <div class="payment-option">
            <input type="radio" id="boleto" name="payment-method" value="boleto">
            <label for="boleto">Boleto Bancário</label>
        </div><a href="checkout.html">
        <button class="pay-button">Finalizar Pagamento</button></a>
    </div>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TV8GJJR"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
</body>
</html>
